## 🛠 The **Real** Fix (Guaranteed and Simple)

### ✅ Step 1 — Override Render’s default behavior

You MUST explicitly provide a **buildCommand** in `render.yaml`.

Replace your existing `render.yaml` with this exact content:

```yaml
services:
  - type: web
    name: e_calculator
    runtime: python
    rootDir: E_Calculator

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate

    startCommand: gunicorn E_Calculator.asgi:application -k uvicorn.workers.UvicornWorker

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: e_calculator
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: E_Calculator.settings
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
