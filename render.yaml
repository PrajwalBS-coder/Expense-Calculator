services:
  - type: pgsql
    name: e_calculator
    databaseName: e_calculator  # Matches your DB
    user: amin_2003
    plan: free

  - type: web
    name: E_Calculator
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: e_calculator
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn mysite.asgi:application -k uvicorn.workers.UvicornWorker"
